<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Calculator</title>
    <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    input { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 1.2em; }
    #error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
    <h1>K8s Calculator</h1>

  <label>Zahl 1: <input type="number" id="num1"></label>
  <label>Zahl 2: <input type="number" id="num2"></label>
  <label>Zahl 3: <input type="number" id="num3"></label>
  <label>Zahl 4: <input type="number" id="num4"></label>

  <button onclick="calculate()">Berechnen</button>

  <div id="result"></div>
  <div id="error"></div>

  <script>
    async function calculate() {
      const num1 = Number(document.getElementById('num1').value);
      const num2 = Number(document.getElementById('num2').value);
      const num3 = Number(document.getElementById('num3').value);
      const num4 = Number(document.getElementById('num4').value);

      document.getElementById('result').textContent = '';
      document.getElementById('error').textContent = '';

      try {
        const response = await fetch('http://localhost:3000/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ num1, num2, num3, num4 })
        });

        if (!response.ok) {
          throw new Error('Fehler bei der Berechnung');
        }

        const data = await response.json();
        document.getElementById('result').textContent = `Ergebnis: ${data.multiplicationResult}`;
      } catch (error) {
        document.getElementById('error').textContent = error.message;
      }
    }
  </script>
    
</body>
</html>
